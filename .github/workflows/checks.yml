name: MVP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.7
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python -m pytest -q
        env:
          NEUROFORGE_LLM_ENABLED: 'false'
      - run: node --check ui/app.js
